    description: Amazon WAF API — Web ACLs business capability. Self-contained, no shared references.
    resources:
    - name: '#CreateWebACL'
      path: /#CreateWebACL
      operations:
      - name: createwebacl
        method: POST
        description: Amazon WAF Create a Web ACL
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: '#GetWebACL'
      path: /#GetWebACL
      operations:
      - name: getwebacl
        method: POST
        description: Amazon WAF Get a Web ACL
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
